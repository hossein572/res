<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="رستوران چاشنی در یوسف‌آباد. طعم خوب، حال خوب. سفارش آنلاین پیتزا، برگر، پاستا و غذاهای ایرانی، و رزرو میز." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>چاشنی | طعم خوب، حال خوب</title>
    <script>
      (function (l) {
        if (!l.search || l.search.indexOf('p=') === -1) return
        var q = {}
        l.search.slice(1).split('&').forEach(function (v) {
          var a = v.split('=')
          q[a[0]] = decodeURIComponent((a.slice(1).join('=') || '').replace(/~and~/g, '&'))
        })
        if (q.p !== undefined) {
          var base = l.pathname.replace(/\/$/, '')
          window.history.replaceState(null, '', base + (q.p || '') + (q.q ? '?' + q.q : '') + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
